<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meu Carro">
<title>Meu Carro</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<script src="vendor/supabase.js" defer></script>
</head>
<body>

<section class="login" id="login" hidden>
  <h1>Meu Carro</h1>
  <p>Entre com o mesmo email e senha do meu-treino.</p>
  <form id="form-login" class="folha-form" style="display:flex;flex-direction:column;gap:14px">
    <label class="campo"><span>Email</span><input class="entrada" type="email" name="email" autocomplete="username" required></label>
    <label class="campo"><span>Senha</span><input class="entrada" type="password" name="senha" autocomplete="current-password" required></label>
    <p class="erro" id="erro-login"></p>
    <button class="botao largo">Entrar</button>
  </form>
</section>

<main id="app" hidden></main>

<nav class="nav" id="nav" hidden>
  <button data-tela="hoje"><svg viewBox="0 0 24 24"><path d="M4 15a8 8 0 1 1 16 0"/><path d="M12 15l4-5"/></svg>Hoje</button>
  <button data-tela="abastecer"><svg viewBox="0 0 24 24"><path d="M5 20V5a1 1 0 0 1 1-1h7a1 1 0 0 1 1 1v15M4 20h11M14 9h2a2 2 0 0 1 2 2v5a1.5 1.5 0 0 0 3 0V8l-3-3"/><path d="M7 8h5"/></svg>Abastecer</button>
  <button data-tela="gastos"><svg viewBox="0 0 24 24"><path d="M14.5 6.5a4 4 0 0 0-5 5L4 17v3h3l5.5-5.5a4 4 0 0 0 5-5l-2.5 2.5-2-2z"/></svg>Gastos</button>
  <button data-tela="resumo"><svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>Resumo</button>
  <button data-tela="ajustes"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>Ajustes</button>
</nav>

<div class="toast" id="toast"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
